
services:

  # =================================
  # POSTGRESQL DATABASE
  # =================================
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed/02_demo_data.sql:/docker-entrypoint-initdb.d/02_demo_data.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - suivi_colis_network

  # =================================
  # PGADMIN
  # =================================
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - suivi_colis_network

  # =================================
  # COLIS SERVICE
  # =================================
  colis-service:
    build:
      context: ./services/colis-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NOTIFICATION_SERVICE_URL: http://notification-service:5005

    ports:
      - "8003:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_healthy

    networks:
      - suivi_colis_network


  # =================================
  # AUTH SERVICE
  # =================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

    ports:
      - "8001:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - suivi_colis_network

  # =================================
  # LIVRAISON SERVICE
  # =================================
  livraison-service:
    build:
      context: ./services/livraison-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      COLIS_SERVICE_URL: http://colis-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:5005

    ports:
      - "8002:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_healthy

    networks:
      - suivi_colis_network
  # =================================
  # STATUT SERVICE
  # =================================
  statut-service:
    build:
      context: ./services/statut-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      DB_HOST: postgres
      DB_PORT: 5432
      COLIS_SERVICE_URL: http://colis-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NOTIFICATION_SERVICE_URL: http://notification-service:5005

    ports:
      - "5003:5003"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    depends_on:
      postgres:
        condition: service_healthy
      colis-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

    networks:
      - suivi_colis_network

  # =================================
  # NOTIFICATION SERVICE
  # =================================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PORT: 5005
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

    ports:
      - "5005:5005"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - suivi_colis_network
# =================================
# PERSISTENT VOLUMES
# =================================
volumes:
  postgres_data:
  pgadmin_data:


# =================================
# NETWORK
# =================================
networks:
  suivi_colis_network:
    driver: bridge
